<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>InfluenceX</title>
    <script>
      // Redirect all 404s back to index.html preserving the path as a query param.
      // The index.html script below restores it via history.replaceState.
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 2) // keep /influencex
            .join("/") +
          "/?p=" +
          encodeURIComponent(
            l.pathname.split("/").slice(2).join("/") +
              (l.search ? l.search : "") +
              l.hash
          )
      );
    </script>
  </head>
</html>
